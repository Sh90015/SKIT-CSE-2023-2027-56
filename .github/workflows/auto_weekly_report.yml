name: Weekly Progress Report Auto-Commit

on:
  schedule:
    # Every Thursday at 11:59 PM IST (18:29 UTC)
    - cron: '29 18 * * 4'

  # Allows manual execution from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-commit:
    runs-on: ubuntu-latest

    steps:
      # 1. Download the repository and full Git history
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Install Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # 3. Install required libraries
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install reportlab matplotlib

      # 4. Generate the weekly PDF report
      - name: Generate weekly report
        run: python generate_report.py weekly

      # 5. Move and commit the report
      - name: Archive and commit report
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p weekly_reports

          shopt -s nullglob
          reports=( *_Weekly_Progress_Report_Form-3_*.pdf )

          if (( ${#reports[@]} == 0 )); then
            echo "ERROR: No weekly PDF report was generated."
            exit 1
          fi

          mv "${reports[@]}" weekly_reports/

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add weekly_reports/

          if git diff --cached --quiet; then
            echo "No new report changes to commit."
          else
            git commit -m \
              "docs: archive weekly Form-3 progress report [skip ci]"

            git push origin HEAD
          fi